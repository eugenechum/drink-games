# Serve the SPA: static files with a fallback to index.html for client-side routes.
# /api (incl. the /api/ws WebSocket upgrade) is routed to the backend by the Ingress.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references the current hashed JS/CSS bundle — never let a
    # browser or intermediary cache it, or a stale build can keep loading
    # after a deploy. The hashed assets themselves are safe to cache hard.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
