description: >
  Drink Games is a phone-friendly party game app: a host creates a room and
  shares a QR code or 4-digit code, friends join from their own phones, and
  the host starts a round of Liar's Dice, Poker Dice, or Texas Hold'em on a
  shared casino-styled table. For small groups playing drinking games together
  in person. No accounts and no persistence — rooms live only while active.

